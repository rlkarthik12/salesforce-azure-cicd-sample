trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  SF_INSTANCE_URL: https://login.salesforce.com

stages:

# =========================
# CI - Scratch Org Validation
# =========================

- stage: Validate
  displayName: Scratch Org Validation

  jobs:

  - job: ScratchOrgValidation

    timeoutInMinutes: 45

    steps:

    - checkout: self

    - bash: |
        npm install -g @salesforce/cli
        sf version
      displayName: Install Salesforce CLI

    - bash: |
        mkdir -p "$(Agent.TempDirectory)/salesforce"

        printf '%s' "$(SF_JWT_KEY_B64)" \
        | base64 --decode \
        > "$(Agent.TempDirectory)/salesforce/server.key"

        chmod 600 "$(Agent.TempDirectory)/salesforce/server.key"

        sf org login jwt \
          --username "$(SF_DEVHUB_USERNAME)" \
          --client-id "$(SF_CONSUMER_KEY)" \
          --jwt-key-file "$(Agent.TempDirectory)/salesforce/server.key" \
          --instance-url "$(SF_INSTANCE_URL)" \
          --alias DevHub \
          --set-default-dev-hub
      displayName: Authenticate Dev Hub

    - bash: |
        chmod +x scripts/ci.sh
        ./scripts/ci.sh
      displayName: Validate in Scratch Org

      env:
        BUILD_BUILDID: $(Build.BuildId)

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: 'test-results/**/*.xml'
        failTaskOnFailedTests: true
      displayName: Publish Apex Results

    - publish: force-app
      artifact: SalesforceMetadata
      displayName: Publish Deployment Artifact

    - bash: |
        sf org logout --target-org DevHub --no-prompt || true
      condition: always()
      displayName: Cleanup

# =========================
# CD - Deploy to Developer Edition
# =========================

- stage: Deploy_DEV
  displayName: Deploy To Developer Edition

  dependsOn: Validate

  condition: succeeded()

  jobs:

  - deployment: DeployDeveloperEdition

    environment: Salesforce-DEV

    strategy:
      runOnce:

        deploy:

          steps:

          - download: current
            artifact: SalesforceMetadata

          - bash: |
              npm install -g @salesforce/cli
            displayName: Install Salesforce CLI

          - bash: |
              mkdir -p "$(Agent.TempDirectory)/salesforce"

              printf '%s' "$(SF_JWT_KEY_B64)" \
              | base64 --decode \
              > "$(Agent.TempDirectory)/salesforce/server.key"

              chmod 600 "$(Agent.TempDirectory)/salesforce/server.key"

              sf org login jwt \
                --username "$(SF_DEV_USERNAME)" \
                --client-id "$(SF_CONSUMER_KEY)" \
                --jwt-key-file "$(Agent.TempDirectory)/salesforce/server.key" \
                --instance-url "$(SF_INSTANCE_URL)" \
                --alias DEV

            displayName: Login To Developer Edition

          - bash: |

              sf project deploy start \
                --target-org DEV \
                --source-dir force-app \
                --test-level RunLocalTests \
                --wait 30 \
                --verbose

            displayName: Deploy Metadata

          - bash: |

              sf apex run test \
                --target-org DEV \
                --test-level RunLocalTests \
                --wait 30

            displayName: Run Apex Tests

          - bash: |
              sf org logout --target-org DEV --no-prompt || true

            displayName: Logout
            condition: always()
